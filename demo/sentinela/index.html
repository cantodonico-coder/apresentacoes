<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecossistema Sentinela · Demonstração · NicoShake Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SENTINELA · BASE VISUAL COMUM (v5)
   Este bloco :root é idêntico nos 4 apps. Cada app muda só o --accent.
   ===================================================================== */
:root{
  /* superfícies */
  --fundo:#0F1420; --sup:#171D2B; --sup-2:#1F2637;
  --linha:#2A3347; --linha-forte:#3A4560;
  /* texto */
  --texto:#EEF1F6; --suave:#A7B0C2; --fraco:#727D92;
  /* estados */
  --ok:#35D07F; --alerta:#FFB627; --perigo:#FF6B6B;
  /* accent de cada app */
  --sentinela:#FF3D9A; --delivery:#2CC8E8; --soldout:#FFB627; --portal:#35D07F;
  --accent:var(--sentinela);
  --sobre-accent:#0F1420;            /* texto em cima do accent */
  /* tipografia */
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* forma */
  --r-painel:18px; --r-controle:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; background:var(--fundo); color:var(--texto);
  font-family:var(--ui); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
/* ============================ fim da base ============================ */

/* ---- Hub ---- */
@property --foco{syntax:'<color>'; inherits:true; initial-value:#FF3D9A}
html{--foco:var(--sentinela); transition:--foco .45s ease}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(70% 55% at 85% -10%, color-mix(in srgb, var(--foco) 16%, transparent) 0%, transparent 70%);
}
.pagina{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:28px 24px 56px}

.topo{display:flex; align-items:center; justify-content:space-between; gap:16px}
.topo .assinatura{display:flex; align-items:center; gap:12px}
.topo img{height:30px; width:auto; display:block}
.topo .marca{font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:-.01em}
.topo .lab{color:var(--fraco); font-size:14px}

.abertura{padding:72px 0 44px; max-width:760px}
.abertura h1{
  font-family:var(--display); font-weight:800; margin:0;
  font-size:clamp(40px,7.2vw,84px); line-height:.98; letter-spacing:-.035em;
  text-wrap:balance;
}
.abertura p{margin:22px 0 0; color:var(--suave); font-size:18px; max-width:56ch}

.grade{display:grid; grid-template-columns:1.05fr 1fr; gap:16px}
.bracos{display:grid; gap:16px}

.app{
  --accent:var(--sentinela);
  display:flex; flex-direction:column; gap:10px;
  background:var(--sup); border:1px solid var(--linha); border-radius:var(--r-painel);
  padding:24px; color:inherit; text-decoration:none;
  transition:border-color .18s ease, background-color .18s ease;
}
a.app:hover, a.app:focus-visible{border-color:var(--accent); background:var(--sup-2)}
.app .papel{display:flex; align-items:center; gap:9px; color:var(--accent); font-weight:600; font-size:14px}
.app .papel::before{content:''; width:9px; height:9px; border-radius:2px; background:var(--accent)}
.app h2{font-family:var(--display); font-weight:800; margin:0; font-size:30px; line-height:1.05; letter-spacing:-.02em}
.app p{margin:0; color:var(--suave); font-size:15px; max-width:46ch}
.app .acao{
  margin-top:auto; padding-top:10px; display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.botao{
  display:inline-flex; align-items:center; justify-content:center;
  padding:9px 18px; border-radius:var(--r-controle); font-weight:700; font-size:14px;
  border:1px solid var(--accent); color:var(--accent); background:transparent;
  transition:background-color .18s ease, color .18s ease;
}
a.app:hover .botao, a.app:focus-visible .botao{background:var(--accent); color:var(--sobre-accent)}
.embreve{font-size:14px; color:var(--fraco)}
.app.inativo{background:transparent; border-style:dashed}
.app.inativo h2{color:var(--suave)}

/* Sentinela: a matriz ocupa a coluna inteira */
.app.matriz{padding:32px; gap:14px; min-height:100%}
.app.matriz h2{font-size:clamp(44px,6vw,72px); line-height:.95; letter-spacing:-.035em}
.app.matriz p{font-size:17px}
.app.matriz .botao{padding:12px 22px; font-size:15px; background:var(--accent); color:var(--sobre-accent)}

.app .cabeca{display:flex; align-items:center; justify-content:space-between; gap:10px}
.estado{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--fraco)}
.estado::before{content:''; width:7px; height:7px; border-radius:50%; background:currentColor}
.estado.on{color:var(--ok)}
.estado.off{color:var(--perigo)}
.resumo{display:flex; flex-wrap:wrap; gap:6px}
.resumo:empty{display:none}
.resumo span{font-size:13px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--sup-2); color:var(--suave)}
.resumo .alerta{color:var(--perigo); background:color-mix(in srgb, var(--perigo) 12%, transparent)}
.dica{font-size:13px; color:var(--alerta)}
.dica:empty{display:none}

.rodape{margin-top:40px; padding-top:20px; border-top:1px solid var(--linha); color:var(--fraco); font-size:14px}


/* ---- App aberto dentro do hub ---- */
.palco{position:fixed; inset:0; z-index:10; display:none; flex-direction:column; background:var(--fundo)}
.palco.aberto{display:flex}
.palco .barra{display:flex; align-items:center; gap:14px; padding:8px 14px; border-bottom:1px solid var(--linha); background:var(--sup)}
.palco .voltar{
  font:700 14px var(--ui); cursor:pointer; padding:7px 14px; border-radius:var(--r-controle);
  background:transparent; color:var(--accent); border:1px solid var(--accent);
}
.palco .voltar:hover{background:var(--accent); color:var(--sobre-accent)}
.palco .onde{color:var(--suave); font-size:14px}
.palco iframe{flex:1; width:100%; border:0; background:var(--fundo)}

@media (max-width:820px){
  .grade{grid-template-columns:1fr}
  .abertura{padding:48px 0 32px}
  .abertura p{font-size:16px}
  .app.matriz{padding:24px}
}
@media (prefers-reduced-motion:reduce){
  html, .app, .botao{transition:none}
}
</style>
</head>

<script>
/* ---------------------------------------------------------------------
   CONFIGURAÇÃO DOS APPS
   href: endereço para abrir o app. Deixe null enquanto não houver link:
         o app aparece como "Em breve" e não é clicável.
   --------------------------------------------------------------------- */
const APPS = [
  {
    id: 'sentinela', matriz: true,
    nome: 'Sentinela',
    papel: 'Encontrar',
    cor: 'var(--sentinela)',
    href: 'matriz.html',
    descricao: 'Monitora editais e licitações em milhares de portais oficiais e resume cada oportunidade com IA. É a matriz: os outros três apps partem dos dados dela.',
  },
  {
    id: 'delivery',
    nome: 'Delivery',
    papel: 'Executar',
    cor: 'var(--delivery)',
    href: 'delivery.html',
    descricao: 'Acompanha o projeto depois do edital ganho, da contratação do artista à prestação de contas.',
  },
  {
    id: 'soldout',
    nome: 'SOLDOUT',
    papel: 'Programar',
    cor: 'var(--soldout)',
    href: 'soldout.html',
    descricao: 'Mede a demanda de eventos e o mercado de artistas para montar line-ups que lotam.',
  },
  {
    id: 'portal',
    nome: 'Portal do Rap',
    papel: 'Divulgar',
    cor: 'var(--portal)',
    href: '../portal-do-rap/',
    descricao: 'Divulga artistas, festas e lançamentos do rap e do hip-hop, com notícias e o Museu do Hip Hop.',
  },
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function cartaoApp(a) {
  const ativo = !!a.href;
  const tag = ativo ? 'a' : 'div';
  const classes = ['app', a.matriz ? 'matriz' : '', ativo ? '' : 'inativo'].filter(Boolean).join(' ');
  return `
    <${tag} class="${classes}" data-app="${esc(a.id)}" style="--accent:${a.cor}" ${ativo ? `href="${esc(a.href)}"` : ''}>
      <span class="cabeca">
        <span class="papel">${esc(a.papel)}</span>
        ${a.servidor ? '<span class="estado" data-estado>Verificando…</span>' : ''}
      </span>
      <h2>${esc(a.nome)}</h2>
      <p>${esc(a.descricao)}</p>
      <span class="resumo" data-resumo></span>
      <span class="dica" data-dica></span>
      <span class="acao">
        ${ativo ? `<span class="botao">Abrir ${esc(a.nome)}</span>` : '<span class="embreve">Em breve</span>'}
      </span>
    </${tag}>`;
}

function renderApps() {
  const matriz = APPS.filter(a => a.matriz);
  const bracos = APPS.filter(a => !a.matriz);
  const grade = document.getElementById('grade');
  grade.innerHTML = matriz.map(cartaoApp).join('') + `<div class="bracos">${bracos.map(cartaoApp).join('')}</div>`;

  /* o fundo da página assume a cor do app em foco */
  const raiz = document.documentElement;
  grade.querySelectorAll('.app').forEach(el => {
    const cor = el.style.getPropertyValue('--accent');
    const acende = () => raiz.style.setProperty('--foco', cor);
    const apaga = () => raiz.style.removeProperty('--foco');
    el.addEventListener('mouseenter', acende);
    el.addEventListener('mouseleave', apaga);
    el.addEventListener('focus', acende);
    el.addEventListener('blur', apaga);
  });
}

renderApps();

/* ---------------------------------------------------------------------
   SERVIDORES LOCAIS: mostra se o app está ligado antes do clique
   --------------------------------------------------------------------- */
const online = {};
async function verificar(a) {
  const card = document.querySelector(`[data-app="${a.id}"]`);
  const selo = card && card.querySelector('[data-estado]');
  if (!selo) return;
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 2500);
  try {
    await fetch(a.href, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal });
    online[a.id] = true;
  } catch (e) {
    online[a.id] = false;
  } finally { clearTimeout(t); }
  selo.className = 'estado ' + (online[a.id] ? 'on' : 'off');
  selo.textContent = online[a.id] ? 'Ligado' : 'Desligado';
  if (online[a.id]) card.querySelector('[data-dica]').textContent = '';
}
function verificarTodos() { APPS.filter(a => a.servidor && a.href).forEach(verificar); }
verificarTodos();
setInterval(verificarTodos, 30000);
window.addEventListener('focus', verificarTodos);

/* ---------------------------------------------------------------------
   RESUMO NOS CARDS: lê o que Delivery e SOLDOUT salvaram neste navegador
   --------------------------------------------------------------------- */
function lerLocal(chave) {
  try { const v = JSON.parse(localStorage.getItem(chave)); return Array.isArray(v) ? v : null; } catch (e) { return null; }
}
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const RESUMOS = {
  delivery() {
    const lista = lerLocal('sentinela_delivery_licitacoes_v1');
    if (!lista) return [];
    const agora = Date.now();
    const ativos = lista.filter(x => x.status !== 'concluido');
    const horas = x => (new Date(x.dataLimite) - agora) / 36e5;
    const atrasados = ativos.filter(x => horas(x) < 0).length;
    const criticos = ativos.filter(x => horas(x) >= 0 && horas(x) <= 48).length;
    return [
      [plural(ativos.length, 'projeto ativo', 'projetos ativos')],
      criticos && [plural(criticos, 'prazo em 48h', 'prazos em 48h'), 'alerta'],
      atrasados && [plural(atrasados, 'atrasado', 'atrasados'), 'alerta'],
    ].filter(Boolean);
  },
  soldout() {
    const lista = lerLocal('sentinela_soldout_eventos_v1');
    if (!lista) return [];
    const agora = Date.now();
    const confirmados = lista.filter(x => x.status === 'confirmado' || x.status === 'producao').length;
    const proximos = lista.filter(x => x.dataEvento && new Date(x.dataEvento) >= agora && x.status !== 'realizado')
      .map(x => Math.ceil((new Date(x.dataEvento) - agora) / 864e5)).sort((a, b) => a - b);
    return [
      [plural(lista.length, 'evento', 'eventos')],
      confirmados && [plural(confirmados, 'confirmado', 'confirmados')],
      proximos.length && [proximos[0] === 0 ? 'Próximo é hoje' : `Próximo em ${plural(proximos[0], 'dia', 'dias')}`, proximos[0] <= 7 ? 'alerta' : ''],
    ].filter(Boolean);
  },
};
function atualizarResumos() {
  Object.entries(RESUMOS).forEach(([id, fn]) => {
    const alvo = document.querySelector(`[data-app="${id}"] [data-resumo]`);
    if (alvo) alvo.innerHTML = fn().map(([txt, cls]) => `<span class="${cls || ''}">${esc(txt)}</span>`).join('');
  });
}
atualizarResumos();
window.addEventListener('storage', atualizarResumos);

/* ---------------------------------------------------------------------
   APPS EMBUTIDOS
   Delivery e SOLDOUT vão dentro deste arquivo (base64) e abrem aqui mesmo,
   sem depender de outros arquivos na pasta. O endereço vira #delivery ou
   #soldout, então o botão Voltar do navegador também funciona.
   --------------------------------------------------------------------- */
function fonteEmbutida(id) {
  const el = document.getElementById('fonte-' + id);
  if (!el) return null;
  const bin = atob(el.textContent.trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);   /* sem isso os acentos quebram */
}

function sincronizarPalco() {
  const id = location.hash.slice(1);
  const app = APPS.find(a => a.id === id);
  const palco = document.getElementById('palco');
  const quadro = document.getElementById('quadro');
  const fonte = app ? fonteEmbutida(id) : null;
  if (!fonte) {
    palco.classList.remove('aberto');
    quadro.removeAttribute('srcdoc');
    document.body.style.overflow = '';
    atualizarResumos();
    return;
  }
  palco.style.setProperty('--accent', app.cor);
  document.getElementById('onde').textContent = app.nome;
  quadro.title = app.nome;
  quadro.srcdoc = fonte;
  palco.classList.add('aberto');
  document.body.style.overflow = 'hidden';
}

document.getElementById('grade').addEventListener('click', e => {
  const el = e.target.closest('a.app');
  if (!el) return;
  const app = APPS.find(a => a.id === el.dataset.app);
  if (app && app.servidor && online[app.id] === false) {
    e.preventDefault();
    el.querySelector('[data-dica]').textContent = `Servidor desligado. Rode o ${app.servidor} e clique de novo.`;
    verificar(app);
    return;
  }
  if (!document.getElementById('fonte-' + el.dataset.app)) return;
  e.preventDefault();
  location.hash = el.dataset.app;
});
document.getElementById('voltar').addEventListener('click', () => {
  history.pushState('', document.title, location.pathname + location.search);
  sincronizarPalco();
});
window.addEventListener('hashchange', sincronizarPalco);
sincronizarPalco();
</script>
</body>
</html>
