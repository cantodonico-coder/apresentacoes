<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinela Delivery · Gestão de Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   SENTINELA · BASE VISUAL COMUM (v5)
   Este bloco :root é idêntico nos 4 apps. Cada app muda só o --accent.
   ===================================================================== */
:root{
  /* superfícies */
  --fundo:#0F1420; --sup:#171D2B; --sup-2:#1F2637;
  --linha:#2A3347; --linha-forte:#3A4560;
  /* texto */
  --texto:#EEF1F6; --suave:#A7B0C2; --fraco:#727D92;
  /* estados */
  --ok:#35D07F; --alerta:#FFB627; --perigo:#FF6B6B;
  /* accent de cada app */
  --sentinela:#FF3D9A; --delivery:#2CC8E8; --soldout:#FFB627; --portal:#35D07F;
  --accent:var(--delivery);
  --sobre-accent:#0F1420;            /* texto em cima do accent */
  /* tipografia */
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* forma */
  --r-painel:18px; --r-controle:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; background:var(--fundo); color:var(--texto);
  font-family:var(--ui); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
/* ============================ fim da base ============================ */

/* ---- Delivery ---- */
body{font-size:14px; line-height:1.45; padding-bottom:48px; font-variant-numeric:tabular-nums}
button{font-family:inherit}
p{margin:0}
::-webkit-scrollbar{height:10px; width:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--linha); border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--linha-forte)}

/* cabeçalho */
.topo{position:sticky; top:0; z-index:20; background:var(--fundo); border-bottom:1px solid var(--linha)}
.topo .faixa{max-width:1680px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap}
.topo .faixa + .faixa{padding-top:0}
.marca{display:flex; align-items:center; gap:14px; min-width:0}
.marca img{height:26px; width:auto; display:block; flex-shrink:0}
.marca .nome{font-family:var(--display); font-weight:800; font-size:24px; line-height:1; letter-spacing:-.025em; color:var(--accent); padding-left:14px; border-left:1px solid var(--linha-forte)}
.marca .oque{color:var(--fraco); font-size:13px}

/* indicadores */
.indicadores{display:flex; margin:0; border:1px solid var(--linha); border-radius:var(--r-controle); background:var(--sup); overflow-x:auto; max-width:100%}
.indicadores div{padding:8px 16px; border-left:1px solid var(--linha); white-space:nowrap}
.indicadores div:first-child{border-left:0}
.indicadores dt{font-size:12px; color:var(--fraco)}
.indicadores dd{margin:0; font-family:var(--display); font-weight:700; font-size:18px; line-height:1.2; color:var(--texto)}
.indicadores .alarme dt, .indicadores .alarme dd{color:var(--perigo)}

/* barra de ações */
.acoes{display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%}
.acoes .espaco{flex:1}
.toolbtn{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 14px; border-radius:var(--r-controle); font-size:14px; font-weight:600;
  border:1px solid var(--linha-forte); background:transparent; color:var(--texto);
  cursor:pointer; white-space:nowrap; transition:background-color .15s, border-color .15s;
}
.toolbtn:hover{background:var(--sup-2)}
.toolbtn i{font-size:17px}
.toolbtn.primary{background:var(--accent); border-color:var(--accent); color:var(--sobre-accent)}
.toolbtn.primary:hover{filter:brightness(1.08); background:var(--accent)}
.file-input-hidden{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden}
.btn-danger{border-color:color-mix(in srgb, var(--perigo) 55%, transparent); color:var(--perigo)}
.btn-danger:hover{background:color-mix(in srgb, var(--perigo) 10%, transparent)}
.btn-ghost{border-color:var(--linha); color:var(--suave)}
.btn-ghost:hover{color:var(--texto)}

/* quadro */
.quadro{max-width:1680px; margin:0 auto; padding:20px 24px 0}
#board{display:flex; gap:14px; overflow-x:auto; padding-bottom:16px; scroll-snap-type:x proximity}
.coluna{
  flex:1 0 min(296px, 86vw); max-width:380px; display:flex; flex-direction:column;
  background:var(--sup); border:1px solid var(--linha); border-radius:var(--r-painel);
  max-height:calc(100vh - 170px); scroll-snap-align:start;
}
.coluna-topo{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px 12px}
.coluna-topo h2{margin:0; font-family:var(--display); font-weight:700; font-size:16px; letter-spacing:-.01em}
.coluna-topo .qtd{font-size:13px; font-weight:600; color:var(--suave); background:var(--sup-2); border-radius:999px; min-width:26px; text-align:center; padding:1px 8px}
.coluna.vazia .coluna-topo h2{color:var(--suave)}
.drop-zone{flex:1; overflow-y:auto; padding:0 10px 2px; border-radius:0 0 var(--r-painel) var(--r-painel)}
.col-target{background:var(--sup-2) !important; outline:2px dashed var(--accent); outline-offset:-4px}
.sem-itens{text-align:center; color:var(--fraco); font-size:13px; padding:26px 12px; margin-bottom:10px; border:1px dashed var(--linha); border-radius:12px}

/* card de projeto */
.lic-card{background:var(--fundo); border:1px solid var(--linha); border-radius:12px; padding:14px; margin-bottom:10px; transition:border-color .15s}
.lic-card:hover{border-color:var(--linha-forte)}
.lic-card.atrasado{border-color:color-mix(in srgb, var(--perigo) 60%, transparent)}
[draggable="true"]{cursor:grab}
[draggable="true"]:active{cursor:grabbing}
.card-drag{opacity:.35}
@keyframes pulse-red{
  0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--perigo) 45%, transparent); border-color:color-mix(in srgb, var(--perigo) 45%, transparent)}
  50%{box-shadow:0 0 0 5px transparent; border-color:var(--perigo)}
}
.critical-pulse{animation:pulse-red 2.2s ease-in-out infinite}

.card-topo{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; min-height:26px}
.prazo{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; padding:3px 9px; border-radius:6px}
.prazo i{font-size:15px}
.tom-perigo{color:var(--perigo); background:color-mix(in srgb, var(--perigo) 14%, transparent)}
.tom-alerta{color:var(--alerta); background:color-mix(in srgb, var(--alerta) 13%, transparent)}
.tom-ok{color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, transparent)}
.tom-accent{color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent)}
.tom-neutro{color:var(--suave); background:var(--sup-2)}
.icone-btn{
  width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  border-radius:8px; border:1px solid var(--linha); background:transparent; color:var(--suave); cursor:pointer; font-size:16px;
}
.icone-btn:hover:not(:disabled){color:var(--texto); border-color:var(--linha-forte); background:var(--sup-2)}
.icone-btn:disabled{opacity:.25; cursor:not-allowed}
.card-ferramentas{display:flex; align-items:center; gap:4px; color:var(--fraco)}

.lic-card h3{margin:0; font-size:15px; font-weight:700; line-height:1.3}
.lic-card .origem{color:var(--fraco); font-size:13px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lic-card .descricao{color:var(--suave); font-size:13.5px; margin-top:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

.proxima{margin:12px 0; padding:10px 12px; background:var(--sup); border-radius:10px}
.proxima .rot{font-size:12px; color:var(--fraco)}
.proxima .acao{font-weight:600; font-size:14px; margin-top:1px}
.proxima .quando{font-size:13px; color:var(--suave); margin-top:3px; display:flex; align-items:center; gap:5px}

/* blocos que abrem: etapas, áreas, anexos */
.bloco, .card-anexos{border:1px solid var(--linha); border-radius:10px; margin-bottom:8px; overflow:hidden}
.bloco-topo, .card-anexos .anx-toggle{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:8px 11px; background:transparent; border:0; cursor:pointer; color:var(--suave); font-size:13px; font-weight:600;
}
.bloco-topo:hover, .card-anexos .anx-toggle:hover{background:var(--sup)}
.bloco-topo span, .card-anexos .anx-toggle span{display:flex; align-items:center; gap:6px}
.bloco-topo .conta{font-weight:500; color:var(--fraco)}
.barra{height:3px; background:var(--sup-2)}
.barra span{display:block; height:100%; background:var(--accent)}
.barra.fina{height:4px; border-radius:2px; overflow:hidden; flex:1}
.bloco-corpo, .card-anexos .anx-body{padding:6px 11px 8px; border-top:1px solid var(--linha)}
.etapa{display:flex; align-items:flex-start; gap:9px; padding:5px 0; cursor:pointer; font-size:13.5px; color:var(--texto)}
.etapa input{width:16px; height:16px; margin-top:2px; flex-shrink:0; accent-color:var(--accent)}
.etapa.feita span{color:var(--fraco); text-decoration:line-through}
.area{padding:8px 0; border-bottom:1px solid var(--linha)}
.area:last-child{border-bottom:0}
.area .l1, .area .l2, .area .l3{display:flex; align-items:center; justify-content:space-between; gap:8px}
.area .l1{font-size:13.5px}
.area .l2{font-size:12.5px; color:var(--fraco); margin:2px 0 6px}
.area .selo{font-size:12px; font-weight:600; padding:1px 7px; border-radius:5px; white-space:nowrap}
.area .icone-btn{width:24px; height:24px; font-size:14px}
.card-anexos .anx-item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 0; font-size:13px}
.card-anexos .anx-item a{color:var(--texto); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.card-anexos .anx-item a:hover{text-decoration:underline}
.card-anexos .anx-item .sz{color:var(--fraco); font-size:12px; white-space:nowrap}

.card-pe{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px}
.quem{display:flex; align-items:center; gap:8px; min-width:0; font-size:13px; color:var(--suave)}
.quem .iniciais{width:24px; height:24px; border-radius:50%; background:var(--sup-2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--texto); flex-shrink:0}
.quem span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mover{display:flex; gap:4px}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(8,11,18,.74); backdrop-filter:blur(3px);
  display:none; align-items:flex-start; justify-content:center; z-index:50;
  padding:5vh 16px; overflow-y:auto;
}
.modal-overlay.open{display:flex}
.modal-box{background:var(--sup); border:1px solid var(--linha); border-radius:var(--r-painel); width:100%; max-width:580px; padding:26px; margin-bottom:5vh}
.modal-box h2{font-family:var(--display); font-weight:800; font-size:24px; letter-spacing:-.02em; margin:0 0 2px}
.modal-box .modal-sub{font-size:14px; color:var(--suave); margin:0 0 20px}
.mfield{margin-bottom:14px}
.mfield label{display:block; font-size:13px; font-weight:600; color:var(--suave); margin-bottom:6px}
.mfield input, .mfield select, .mfield textarea{
  width:100%; background:var(--fundo); border:1px solid var(--linha-forte); border-radius:var(--r-controle);
  color:var(--texto); font-family:var(--ui); font-size:15px; padding:10px 12px; outline:none; color-scheme:dark;
}
.mfield input:focus, .mfield select:focus, .mfield textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
.mfield ::placeholder{color:var(--fraco)}
.mrow2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px}
.modal-actions .right{display:flex; gap:8px; margin-left:auto}
.mfield label.anexo-drop{
  border:1px dashed var(--linha-forte); border-radius:var(--r-controle); padding:14px; text-align:center;
  cursor:pointer; font-size:14px; font-weight:500; color:var(--suave); margin-bottom:0;
}
.mfield label.anexo-drop:hover{border-color:var(--accent); color:var(--texto)}
.anexo-list{margin-top:10px; display:flex; flex-direction:column; gap:6px}
.anexo-row{display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--fundo); border:1px solid var(--linha); border-radius:8px; padding:8px 11px; font-size:13.5px}
.anexo-row a{color:var(--texto); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.anexo-row a:hover{text-decoration:underline}
.anexo-row .sz{color:var(--fraco); font-size:12px; white-space:nowrap}
.anexo-row button{background:transparent; border:0; color:var(--suave); cursor:pointer; font-size:15px; width:22px; height:22px; flex-shrink:0}
.anexo-row button:hover{color:var(--perigo)}
.anexo-note{font-size:12.5px; color:var(--fraco); margin-top:7px; line-height:1.5}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--sup-2); border:1px solid var(--linha-forte); color:var(--texto); font-size:14px;
  padding:12px 18px; border-radius:var(--r-controle); z-index:60; opacity:0; transition:.25s;
  max-width:90vw; text-align:center; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width:700px){
  .topo{position:static}
  .topo .faixa{padding:12px 14px}
  .quadro{padding:14px 14px 0}
  .coluna{max-height:none}
  .marca .oque{display:none}
  .mrow2{grid-template-columns:1fr}
  .modal-box{padding:20px}
  .acoes .espaco{display:none}
}
@media (prefers-reduced-motion:reduce){
  .critical-pulse{animation:none; border-color:var(--perigo)}
  .toast, .toolbtn, .lic-card{transition:none}
}
</style>
</head>

<script>
/* ---- Diálogos no visual do app (substituem prompt/confirm do navegador) ---- */
function dialogo({ titulo, texto = '', campo = null, valor = '', tipo = 'text', ok = 'Confirmar', perigo = false }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay open';
    ov.style.zIndex = 200;
    ov.innerHTML = `<form class="modal-box" style="max-width:420px">
      <h2></h2>${texto ? '<p class="modal-sub"></p>' : ''}
      ${campo !== null ? '<div class="mfield"><label></label><input autocomplete="off"></div>' : ''}
      <div class="modal-actions"><div class="right">
        <button type="button" class="toolbtn btn-ghost">Cancelar</button>
        <button type="submit" class="toolbtn ${perigo ? 'btn-danger' : 'primary'}"></button>
      </div></div></form>`;
    const form = ov.querySelector('form');
    form.querySelector('h2').textContent = titulo;
    if (texto) form.querySelector('.modal-sub').textContent = texto;
    form.querySelector('[type=submit]').textContent = ok;
    const input = form.querySelector('input');
    if (input) {
      form.querySelector('label').textContent = campo;
      input.type = tipo; input.value = valor;
      if (tipo === 'number') { input.step = 'any'; input.min = '0'; }
    }
    const cancelar = campo !== null ? null : false;
    const fim = v => { document.removeEventListener('keydown', tecla); ov.remove(); resolve(v); };
    const tecla = e => { if (e.key === 'Escape') fim(cancelar); };
    document.addEventListener('keydown', tecla);
    form.addEventListener('submit', e => { e.preventDefault(); fim(input ? input.value : true); });
    form.querySelector('.btn-ghost').onclick = () => fim(cancelar);
    ov.addEventListener('click', e => { if (e.target === ov) fim(cancelar); });
    document.body.appendChild(ov);
    (input || form.querySelector('[type=submit]')).focus();
  });
}

/* ---- Senha de edição: guardada como hash SHA-256, não como texto legível ---- */
async function hashPin(pin) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sentinela:' + pin));
    return 'h1:' + Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    return btoa(unescape(encodeURIComponent(pin)));   /* navegador sem crypto.subtle */
  }
}
async function pinConfere(guardada, tentativa) {
  if (guardada.startsWith('h1:')) return (await hashPin(tentativa)) === guardada;

}

function reviveDates(list) {
  return list.map(l => ({ ...l, dataLimite: new Date(l.dataLimite) }));
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || !parsed.length) return null;
    return reviveDates(parsed);
  } catch (e) {
    return null;
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(licitacoes));
  } catch (e) {
    console.warn('Não foi possível salvar localmente:', e);
    if (typeof toast === 'function') {
      toast('Armazenamento local cheio — remova alguns anexos antigos para continuar salvando.');
    }
  }
}

let expandedCards = new Set();

function statusIndex(key) {
  return STATUSES.findIndex(s => s.key === key);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function urgency(item) {
  if (item.status === 'concluido') {
    return { label: 'Finalizado', cls: 'tom-neutro', pulse: false };
  }
  const hrs = (item.dataLimite - new Date()) / 36e5;
  if (hrs < 0) {
    return { label: 'Atrasado', cls: 'tom-perigo', pulse: false, cardBorder: 'atrasado' };
  }
  if (hrs <= 48) {
    return { label: `Crítico: ${Math.max(0, Math.round(hrs))}h`, cls: 'tom-perigo', pulse: true, cardBorder: 'critical-pulse' };
  }
  if (hrs <= 72) {
    return { label: `Atenção: ${Math.round(hrs)}h`, cls: 'tom-alerta', pulse: false };
  }
  if (hrs <= 168) {
    return { label: `Próximo: ${Math.round(hrs / 24)} dias`, cls: 'tom-alerta', pulse: false };
  }
  return { label: `No prazo: ${Math.round(hrs / 24)} dias`, cls: 'tom-ok', pulse: false };
}

function formatDate(d) {
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
         ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function formatCurrency(v) {
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
}

function renderStats() {
  const criticas = licitacoes.filter(l => l.status !== 'concluido' && (l.dataLimite - new Date()) / 36e5 <= 48).length;
  const ativas = licitacoes.filter(l => l.status !== 'concluido').length;
  const valorTotal = licitacoes.reduce((acc, l) => acc + (l.valorEstimado || 0), 0);
  const concluidas = licitacoes.filter(l => l.status === 'concluido').length;
  const todasAreas = licitacoes.flatMap(l => l.areas || []);
  const horasTrab = todasAreas.reduce((a, b) => a + b.horasTrabalhadas, 0);
  const horasPrev = todasAreas.reduce((a, b) => a + b.horasPrevistas, 0);

  /* o que pede ação vem primeiro */
  const stats = [
    { label: 'Críticos (até 48h)', value: criticas, alarme: criticas > 0 },
    { label: 'Ativos', value: ativas },
    { label: 'Horas trabalhadas', value: `${horasTrab}h de ${horasPrev}h` },
    { label: 'Valor em andamento', value: formatCurrency(valorTotal) },
    { label: 'Concluídos', value: concluidas },
  ];

  document.getElementById('statsRow').innerHTML = stats.map(s => `
    <div class="${s.alarme ? 'alarme' : ''}">
      <dt>${s.label}</dt>
      <dd>${s.value}</dd>
    </div>
  `).join('');
}

async function logHours(licId, areaId) {
  if (!requireEdit()) return;
  const item = licitacoes.find(l => l.id === licId);
  if (!item) return;
  const area = (item.areas || []).find(a => a.id === areaId);
  if (!area) return;
  const input = await dialogo({ titulo: 'Registrar horas', texto: area.nome, campo: 'Horas trabalhadas', valor: '1', tipo: 'number', ok: 'Registrar' });
  if (input === null) return;
  const val = parseFloat(input.replace(',', '.'));
  if (isNaN(val) || val <= 0) return;
  area.horasTrabalhadas = Math.round((area.horasTrabalhadas + val) * 100) / 100;
  if (area.status === 'pendente') area.status = 'andamento';
  renderBoard();
}

function toggleExpand(id) {
  if (expandedCards.has(id)) expandedCards.delete(id);
  else expandedCards.add(id);
  renderBoard();
}

function toggleSubtask(licId, subId) {
  if (!requireEdit()) return;
  const item = licitacoes.find(l => l.id === licId);
  if (!item) return;
  const task = (item.subtarefas || []).find(t => t.id === subId);
  if (!task) return;
  task.concluida = !task.concluida;
  renderBoard();
}

function moveStatus(id, dir) {
  if (!requireEdit()) return;
  const item = licitacoes.find(l => l.id === id);
  if (!item) return;
  const newIdx = statusIndex(item.status) + dir;
  if (newIdx < 0 || newIdx >= STATUSES.length) return;
  item.status = STATUSES[newIdx].key;
  renderBoard();
}

function attachDnD() {
  if (!editMode) return;
  document.querySelectorAll('.lic-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', card.dataset.id);
      setTimeout(() => card.classList.add('card-drag'), 0);
    });
    card.addEventListener('dragend', () => card.classList.remove('card-drag'));
  });

  document.querySelectorAll('.drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => {
      e.preventDefault();
      zone.classList.add('col-target');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('col-target'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('col-target');
      const id = e.dataTransfer.getData('text/plain');
      const item = licitacoes.find(l => l.id === id);
      if (item) {
        item.status = zone.dataset.col;
        renderBoard();
      }
    });
  });
}

/* ================= ANEXOS ================= */
const MAX_ANEXO_BYTES = 800 * 1024;       // 800KB por arquivo
const MAX_ANEXOS_POR_ITEM = 4;
const WARN_TOTAL_BYTES = 4 * 1024 * 1024; // 4MB somando todos os projetos

let modalAnexos = [];

function totalAnexosBytes() {
  return licitacoes.reduce((acc, l) => acc + (l.anexos || []).reduce((a, x) => a + (x.tamanho || 0), 0), 0);
}

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderAnexoList() {
  const box = document.getElementById('anexoList');
  if (!modalAnexos.length) { box.innerHTML = ''; return; }
  box.innerHTML = modalAnexos.map(a => `
    <div class="anexo-row">
      <a href="${a.dataUrl}" target="_blank" rel="noopener" download="${esc(a.nome)}">${esc(a.nome)}</a>
      <span class="sz">${formatBytes(a.tamanho)}</span>
      <button type="button" onclick="removeAnexo('${a.id}')" title="Remover"><i class="ti ti-x"></i></button>
    </div>
  `).join('');
}

function removeAnexo(id) {
  modalAnexos = modalAnexos.filter(a => a.id !== id);
  renderAnexoList();
}

function onAnexoFileChange(e) {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (!files.length) return;

  if (modalAnexos.length + files.length > MAX_ANEXOS_POR_ITEM) {
    toast(`Máximo de ${MAX_ANEXOS_POR_ITEM} anexos por projeto.`);
    return;
  }

  files.forEach(file => {
    if (file.size > MAX_ANEXO_BYTES) {
      toast(`"${file.name}" tem ${formatBytes(file.size)} — o limite é ${formatBytes(MAX_ANEXO_BYTES)}.`);
      return;
    }
    if (totalAnexosBytes() + file.size > WARN_TOTAL_BYTES) {
      toast('Perto do limite de armazenamento local. Considere remover anexos antigos (ou aguardar a cloud).');
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      modalAnexos.push({
        id: generateId('anx'),
        nome: file.name,
        tipo: file.type,
        tamanho: file.size,
        dataUrl: ev.target.result,
      });
      renderAnexoList();
    };
    reader.onerror = () => toast(`Não foi possível ler "${file.name}".`);
    reader.readAsDataURL(file);
  });
}

function anexosHTML(item) {
  const anexos = item.anexos || [];
  if (!anexos.length) return '';
  const key = 'anx-' + item.id;
  const isOpen = expandedCards.has(key);

      <button type="button" class="anx-toggle" onclick="toggleExpand('${key}')">
        <span><i class="ti ti-paperclip"></i> ${anexos.length} anexo${anexos.length > 1 ? 's' : ''}</span>

  const prazo = new Date(prazoVal);

  if (editingId) {
    const item = licitacoes.find(l => l.id === editingId);
    if (item) {
      Object.assign(item, {
        nome, cliente, referencia, descricao, status,
        dataLimite: prazo, proximaEntrega: entrega, responsavel, valorEstimado: valor, anexos,
      });
    }
    toast('Projeto atualizado.');
  } else {
    licitacoes.push({
      id: generateId('proj'), nome, cliente, referencia, descricao, status,
      dataLimite: prazo, proximaEntrega: entrega, responsavel, valorEstimado: valor, anexos,
      subtarefas: [], areas: [],
    });
    toast('Projeto cadastrado.');
  }
  closeModal();
  renderBoard();
}

function generateId(prefix) {
  return prefix + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}


/* ================= MODO EDIÇÃO / VISUALIZAÇÃO ================= */
let editMode = false;
const PIN_KEY = 'sentinela_delivery_pin_v1';

function requireEdit() {
  if (!editMode) {
    toast('Ative o modo edição (senha) para fazer isso.');
    return false;
  }
  return true;
}

function getStoredPin() {
  try { return localStorage.getItem(PIN_KEY); } catch (e) { return null; }
}
async function setStoredPin(pin) {
  const h = await hashPin(pin);
  try { localStorage.setItem(PIN_KEY, h); } catch (e) {}
}
async function checkPin(candidate) {
  const stored = getStoredPin();
  if (!stored) return false;
  const ok = await pinConfere(stored, candidate);
  if (ok && !stored.startsWith('h1:')) await setStoredPin(candidate);   /* migra senha antiga */
  return ok;
}

function updateLockUI() {
  const btn = document.getElementById('btnLockToggle');
  btn.innerHTML = editMode
    ? '<i class="ti ti-lock-open"></i>Modo edição ativo'
    : '<i class="ti ti-lock"></i>Modo visualização';
  btn.classList.toggle('primary', editMode);
  document.getElementById('btnNew').style.display = editMode ? 'inline-flex' : 'none';
  document.getElementById('btnImport').style.display = editMode ? 'inline-flex' : 'none';
  document.getElementById('btnChangePin').style.display = editMode ? 'inline-flex' : 'none';
}

async function toggleLock() {
  if (editMode) {
    editMode = false;
    toast('Modo visualização ativado — cadastro e edição bloqueados.');
    renderBoard();
    updateLockUI();
    return;
  }
  const stored = getStoredPin();
  if (!stored) {
    const pin = await dialogo({ titulo: 'Criar senha de edição', texto: 'Ainda não há senha. Ela fica salva só neste navegador.', campo: 'Nova senha', tipo: 'password', ok: 'Criar e entrar' });
    if (!pin) return;
    await setStoredPin(pin);
    editMode = true;
    toast('Senha definida. Modo edição ativado.');
  } else {
    const attempt = await dialogo({ titulo: 'Modo edição', campo: 'Senha de edição', tipo: 'password', ok: 'Entrar' });
    if (attempt === null) return;
    if (await checkPin(attempt)) {
      editMode = true;
      toast('Modo edição ativado.');
    } else {
      toast('Senha incorreta.');
      return;
    }
  }
  renderBoard();
  updateLockUI();
}

async function changePin() {
  const current = await dialogo({ titulo: 'Trocar senha', campo: 'Senha atual', tipo: 'password', ok: 'Continuar' });
  if (current === null) return;
  if (!(await checkPin(current))) { toast('Senha atual incorreta.'); return; }
  const novo = await dialogo({ titulo: 'Trocar senha', campo: 'Nova senha de edição', tipo: 'password', ok: 'Salvar' });
  if (!novo) return;
  await setStoredPin(novo);
  toast('Senha alterada.');
}

/* ================= TOAST ================= */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4200);
}

/* ================= PLANILHA: import / export / modelo ================= */
const SHEET_COLS = [
  { wch: 12 }, { wch: 34 }, { wch: 26 }, { wch: 42 },
  { wch: 20 }, { wch: 17 }, { wch: 32 }, { wch: 22 }, { wch: 18 },
];

function normalizeText(s) {
  return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

function normalizeStatus(raw) {
  const norm = normalizeText(raw);
  const byKey = STATUSES.find(s => normalizeText(s.key) === norm);
  if (byKey) return byKey.key;
  const byLabel = STATUSES.find(s => normalizeText(s.label) === norm);
  if (byLabel) return byLabel.key;
  return null;
}

function formatDateForSheet(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function parsePrazoCell(cell) {
  if (cell instanceof Date && !isNaN(cell)) return cell;
  if (typeof cell === 'number') {
    const utcDays = Math.floor(cell - 25569);
    const utcValue = utcDays * 86400;
    return new Date(utcValue * 1000);
  }
  if (typeof cell === 'string' && cell.trim()) {
    const m = cell.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})/);
    if (m) {
      const [, d, mo, y, h, mi] = m;
      return new Date(+y, +mo - 1, +d, +h, +mi);
    }
    const parsed = new Date(cell);
    if (!isNaN(parsed)) return parsed;
  }
  return null;
}

function rowsFromLicitacoes(list) {
  return list.map(l => ({
    'ID': l.id,
    'Nome do Projeto': l.nome,
    'Cliente / Órgão': l.cliente || '',
    'Referência': l.referencia || '',
    'Descrição': l.descricao,
    'Status': (STATUSES.find(s => s.key === l.status) || {}).label || l.status,
    'Prazo': formatDateForSheet(l.dataLimite),
    'Próxima Entrega': l.proximaEntrega || '',
    'Responsável': l.responsavel || '',
    'Valor Estimado (R$)': l.valorEstimado || 0,
  }));
}

function todayStamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
}

function exportSpreadsheet() {
  const rows = rowsFromLicitacoes(licitacoes);
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = SHEET_COLS;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Projetos');
  XLSX.writeFile(wb, `sentinela-delivery-${todayStamp()}.xlsx`);
  toast('Planilha exportada.');
}

function downloadTemplate() {
  const example = [{
    'ID': '',
    'Nome do Projeto': 'Nome do projeto ou entrega',
    'Cliente / Órgão': 'Nome do cliente ou órgão (opcional)',
    'Referência': 'Nº de contrato, processo ou código interno (opcional)',
    'Descrição': 'Descrição do que é esse projeto',
    'Status': 'Planejamento',
    'Prazo': formatDateForSheet(hoursFromNow(72)),
    'Próxima Entrega': 'Próxima ação a fazer',
    'Responsável': 'Nome da pessoa responsável',
    'Valor Estimado (R$)': 100000,
  }];
  const ws = XLSX.utils.json_to_sheet(example);
  ws['!cols'] = SHEET_COLS;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Projetos');

  const instrucoes = [
    { 'Campo': 'ID', 'Instrução': 'Deixe em branco para criar um projeto novo. Preencha com o ID existente (veja na planilha exportada) para atualizar um já cadastrado.' },
    { 'Campo': 'Cliente / Órgão e Referência', 'Instrução': 'Opcionais — deixe em branco para projetos internos, sem cliente externo ou processo formal.' },
    { 'Campo': 'Status', 'Instrução': 'Use um destes textos: ' + STATUSES.map(s => s.label).join(', ') },
    { 'Campo': 'Prazo', 'Instrução': 'Formato dd/mm/aaaa hh:mm — exemplo: 15/03/2026 14:30' },
    { 'Campo': 'Valor Estimado (R$)', 'Instrução': 'Apenas números, sem "R$" nem pontos de milhar. Pode deixar 0 se não se aplicar.' },
  ];
  const ws2 = XLSX.utils.json_to_sheet(instrucoes);
  ws2['!cols'] = [{ wch: 26 }, { wch: 78 }];
  XLSX.utils.book_append_sheet(wb, ws2, 'Instruções');

  XLSX.writeFile(wb, 'modelo-sentinela-delivery.xlsx');
  toast('Modelo baixado.');
}

function handleImportFile(file) {
  if (!requireEdit()) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      let created = 0, updated = 0, statusWarnings = 0;
      rows.forEach(row => {
        const id = (row['ID'] || '').toString().trim();
        const nome = (row['Nome do Projeto'] || '').toString().trim();
        const cliente = (row['Cliente / Órgão'] || '').toString().trim();
        const referencia = (row['Referência'] || '').toString().trim();
        if (!nome && !cliente && !referencia) return;

        let statusKey = normalizeStatus(row['Status']);
        if (!statusKey) { statusKey = 'elaboracao'; statusWarnings++; }

        const prazo = parsePrazoCell(row['Prazo']) || hoursFromNow(72);
        const valor = parseFloat(row['Valor Estimado (R$)']) || 0;

        const payload = {
          nome: nome || '(sem nome)',
          cliente,
          referencia,
          descricao: (row['Descrição'] || '').toString().trim(),
          status: statusKey,
          dataLimite: prazo,
          proximaEntrega: (row['Próxima Entrega'] || '').toString().trim(),
          responsavel: (row['Responsável'] || '').toString().trim(),
          valorEstimado: valor,
        };

        const existing = id && licitacoes.find(l => l.id === id);
        if (existing) {
          Object.assign(existing, payload);
          updated++;
        } else {
          licitacoes.push({ id: id || generateId('proj'), ...payload, subtarefas: [], areas: [] });
          created++;
        }
      });

      renderBoard();
      let msg = `Importação concluída: ${created} novo(s), ${updated} atualizado(s).`;
      if (statusWarnings) msg += ` ${statusWarnings} com status não reconhecido (usado "Planejamento").`;
      toast(msg);
    } catch (err) {
      console.error(err);
      toast('Não foi possível ler essa planilha. Confira se o formato bate com o modelo.');
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ================= LIGAÇÃO DOS BOTÕES ================= */
populateStatusSelect();
document.getElementById('btnNew').onclick = openNewModal;
document.getElementById('btnCancel').onclick = closeModal;
document.getElementById('btnDelete').onclick = async () => {
  if (!requireEdit()) return;
  if (!editingId) return;
  if (!(await dialogo({ titulo: 'Excluir projeto?', texto: 'Essa ação não pode ser desfeita.', ok: 'Excluir', perigo: true }))) return;
  licitacoes = licitacoes.filter(l => l.id !== editingId);
  closeModal();
  renderBoard();
  toast('Projeto excluído.');
};
document.getElementById('modalForm').addEventListener('submit', onModalSubmit);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') closeModal();
});
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) handleImportFile(file);
  e.target.value = '';
});
document.getElementById('btnExport').onclick = exportSpreadsheet;
document.getElementById('btnTemplate').onclick = downloadTemplate;
document.getElementById('btnLockToggle').onclick = toggleLock;
document.getElementById('btnChangePin').onclick = changePin;
document.getElementById('fAnexoInput').addEventListener('change', onAnexoFileChange);

updateLockUI();
renderBoard();
setInterval(renderBoard, 60000);
</script>
